# Copy to config.toml and adjust. Secrets (ANTHROPIC_API_KEY) come from the environment, never this file.

[paths]
database = "data/pipeline.db"
dataset_manifest = "data/dataset/manifest.json"
processed_dir = "data/processed"
log_dir = "logs"
client_secrets = "secrets/client_secret.json"   # OAuth client from Google Cloud Console
token_file = "secrets/youtube_token.json"

[sources]
# "local"  = data/dataset/manifest.json (your own clips or licensed test clips)
# "folder" = a folder of videos you made (see [folder]): just drop files in
# "tiktok" = your own TikTok account via the official Display API (see [tiktok])
enabled = ["local"]

[folder]
path = "/mnt/c/Users/YOURNAME/Videos/shortpipe"   # Windows folder C:\Users\YOURNAME\Videos\shortpipe, seen from WSL
owner = ""                # your name: confirms you made/own every video in this folder (required)
recursive = false         # also scan sub-folders
auto_approve = true       # schedule every video here unless the AI flags a problem
skip_analysis = true      # don't run the slow ranking step for these (titles still use AI)

[tiktok]
# From your app on developers.tiktok.com. Prefer env vars TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET.
client_key = ""
client_secret = ""
video_dir = "data/tiktok"        # put your exported videos here as <video_id>.mp4
token_file = "secrets/tiktok_token.json"
redirect_port = 8765             # register http://localhost:8765/callback/ as the Desktop redirect URI
max_videos = 50

[ai]
# "ollama"  = local model on your computer (free, no account; install from https://ollama.com)
# "claude"  = Claude API (needs ANTHROPIC_API_KEY and API credit)
# "offline" = deterministic keyword rules (no AI; for tests/demos)
provider = "ollama"
max_retries = 3

ollama_model = "llama3.2:3b"   # run `ollama pull llama3.2:3b` first; bigger = better but slower
ollama_url = "http://localhost:11434"   # or set OLLAMA_HOST
ollama_timeout = 300           # seconds per request; CPU-only machines can be slow
ollama_vision_model = ""       # optional, e.g. "gemma3:4b": looks at frames so titles match the video
vision_frames = 3

model = "claude-opus-5-5"      # Claude API only; override with CLAUDE_MODEL
effort = "medium"              # Claude API only: low | medium | high | xhigh | max

[selection]
# Topics you want the AI to favour when ranking
topics = ["science", "programming", "study tips", "math"]
min_views = 1000
min_relevance = 0.5        # 0..1, from the AI analysis
max_candidates_per_run = 10
# Licenses accepted as "authorized". Anything else is rejected before processing.
allowed_licenses = ["owned", "cc0", "cc-by", "written-permission"]

[processing]
max_duration_seconds = 60
width = 1080
height = 1920
video_bitrate = "4M"

[schedule]
uploads_per_day = 5
window_start = "09:00"     # local time
window_end = "21:00"
timezone = "Europe/Berlin"
days_ahead = 3

[youtube]
title = ""                 # fixed title for every upload, e.g. "#fyp #viral"; "" = AI-written title
title_hashtags = ""        # added after AI titles, e.g. "#shorts"
style = "educational"      # AI writing style: "educational" or "creator" (short, specific, curious)
ai_note = true             # "written with AI assistance" line under AI descriptions
description = "ai"         # "ai" = AI-written description, "none" = no description
privacy = "private"        # "private" | "unlisted" | "public" (unaudited API projects are forced to private)
publish_interval_minutes = 0   # upload-now: 60 = 1st video public now, next ones 1 h apart (needs privacy = "public")
publish_window = ""            # e.g. "18:00-22:00": only publish in these hours (rest moves to next day)
publish_timezone = "America/New_York"   # time zone of the window (US Eastern)
category_id = "27"         # 27 = Education
default_language = "en"
